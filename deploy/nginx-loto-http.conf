# loto.tir-tartegnin.ch — vhost HTTP derrière le reverse proxy OPNsense qui termine TLS.
# Même schéma que locations/tir/challenges (listen 80). Le login admin est fait par l'app
# (OIDC Authentik, /api/auth/*) : nginx ne fait aucune authentification.
# Le proxy amont doit transmettre X-Forwarded-Proto: https.

map $http_x_forwarded_proto $loto_fwd_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name loto.tir-tartegnin.ch;

    root /opt/loto/frontend/dist;
    index index.html;

    # API (publique + /api/auth + /api/admin, protégée par le backend)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $loto_fwd_proto;
    }

    # Assets versionnés (hash dans le nom de fichier) : cache long, immuable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA (y compris /admin) : ne jamais mettre l'index en cache, sinon un nouveau build n'est pas pris
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
